server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Baseline security headers for the SPA (the API sets its own via helmet).
  # Note: nginx only inherits add_header into a location that defines none,
  # so /assets/ repeats them below.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

  # Long-cache the content-hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SPA history-mode fallback — every route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
