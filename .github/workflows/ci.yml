name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check + build (nest build → tsc)
        run: pnpm --filter quiz-app-be build
      - name: Unit tests (Jest — repositories/SDK mocked, no DB)
        run: pnpm --filter quiz-app-be test

  frontend:
    name: Frontend — build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check + build (vue-tsc + vite)
        run: pnpm --filter quiz-app-fe build
      - name: Unit tests (Vitest)
        run: pnpm --filter quiz-app-fe test

  lint:
    name: Lint — backend + frontend (ESLint)
    runs-on: ubuntu-latest
    # Blocking: any ESLint *error* fails the pipeline (warnings are reported only).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint backend (no --fix)
        run: pnpm --filter quiz-app-be lint:ci
      - name: ESLint frontend
        if: always()
        run: pnpm --filter quiz-app-fe lint

  e2e:
    name: Backend — e2e (Supertest + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database only — never Supabase, never production.
      NODE_ENV: test
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: quiz_test
      DB_SSL: 'false'
      # The empty CI database is created by the migrations (run on app boot), exactly as in production.
      DB_SYNCHRONIZE: 'false'
      JWT_SECRET: ci-e2e-jwt-secret-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ADMIN_SECRET: ci-e2e-admin-secret-not-for-production
      CORS_ORIGINS: http://localhost:5173
      # The e2e suite logs in several times from one IP — relax the auth throttle.
      THROTTLE_AUTH_LIMIT: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: E2E tests (Jest + Supertest against the Postgres service)
        run: pnpm --filter quiz-app-be test:e2e
